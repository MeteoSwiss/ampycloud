# This workflow will build and push the package onto PyPI using trusted publishing (OIDC).
# It requires configuring trusted publishers on both PyPI and TestPyPI for this repository.
# See: https://docs.pypi.org/trusted-publishers/creating-a-project-through-oidc/
#
# It will trigger the moment a new release or pre-release is being published.
# Edit 12.07.2024: added the option for a manual trigger
#
# Copyright (c) 2022-2024 fpavogt; frederic.vogt@meteoswiss.ch

name: CI_pypi

on:
  workflow_dispatch:  # Allows to trigger the release to pypi manually
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:

    - name: Checkout current repository (auto release)
      if: ${{ github.event_name == 'release' }}
      uses: actions/checkout@v4

    - name: Checkout current repository (manual release from master)
      if: ${{ github.event_name == 'workflow_dispatch' }}
      uses: actions/checkout@v4
      with:
        repository: MeteoSwiss/ampycloud
        ref: master

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
      shell: bash

    - name: Build the distributions
      run: python -m build
      shell: bash

    - name: Upload distribution artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ampycloud
    permissions:
      id-token: write
    steps:

    - name: Download distribution artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ampycloud
    permissions:
      id-token: write
    steps:

    - name: Download distribution artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
