# This workflow will build and publish the Python package to PyPi and the documentation to the `gh-pages` branch of the
# repository when a new tag is added.
# It uses the `peaceiris/actions-gh-pages` action to handle the GitHub pages publishing and
# `pypa/gh-action-pypi-publish@release/v1` to publish to pypi using trusted publishers feature.
#
# Copyright (c) 2026 MeteoSwiss, created by autometpy; f_autometpy@meteoswiss.ch

name: CI_publish

on:
  push:
    tags: '**'

jobs:

  tests:
    uses: ./.github/workflows/CI_test.yaml

  publish:
    runs-on: ubuntu-latest
    needs: tests

    permissions:
      id-token: write
      contents: write
      pages: write

    steps:
    - name: Checkout current repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: 3.11

    - name: Install poetry and python package
      run: |
        python -m pip install --upgrade pip
        python -m pip install poetry
        poetry install

    # The version is maintained in src/ampycloud/version.py, so we check that the tag matches the version in that file.
    - name: Check tag matches package version
      run: |
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        PKG_VERSION=$(python -c "from src.ampycloud.version import VERSION; print(VERSION)")
        if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
          echo "::error::Tag version ($TAG_VERSION) does not match src/ampycloud/version.py ($PKG_VERSION)"
          exit 1
        fi

    - name: Build artifacts
      run: |
        poetry version $(python -c "from src.ampycloud.version import VERSION; print(VERSION)")
        poetry build

    - name: Publish to PyPi
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/

    - name: Build documentation
      env:
        VERSION: ${{ github.ref_name }}
        # use the switcher config from main to show all the versions (past and future)
        VERSION_SWITCHER_CONFIG_URL: ../_static/switcher_config.json
        GITHUB_SHA: ${{ github.sha }}
      # Set the buildId to the first 7 digits of the commit hash
      run: BUILD_ID=$(echo ${GITHUB_SHA::7}) poetry run sphinx-build doc doc/_build/${{ github.ref_name }}

    - name: Publish documentation
      uses: peaceiris/actions-gh-pages@v3

      with:
        publish_branch: gh-pages
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: doc/_build/
        keep_files: true
